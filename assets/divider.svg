<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="40" viewBox="0 0 1000 40" role="img"><title>divider</title><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#7d8590" fill-opacity=".18"/></pattern><linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#3fb950"/><stop offset=".55" stop-color="#58a6ff"/><stop offset="1" stop-color="#a371f7"/></linearGradient><linearGradient id="g" x1="0" x2="1"><stop stop-color="#3fb950" stop-opacity="0"/><stop offset="1" stop-color="#3fb950"/></linearGradient></defs><style>
@keyframes reveal{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes flow{to{stroke-dashoffset:-104}}
@keyframes pulse{50%{opacity:.3}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes unspin{to{transform:rotate(-360deg)}}
@keyframes draw{0%{stroke-dashoffset:1}30%,88%{stroke-dashoffset:0}100%{stroke-dashoffset:-1}}
@keyframes blink{50%{opacity:0}}
.reveal{animation:reveal .9s cubic-bezier(.2,.7,.2,1) backwards}
