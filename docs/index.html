<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contribution City</title>
<meta name="description" content="Satyaranjan Behera's GitHub contributions as an interactive 3D city.">
<style>
:root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--text:#e6edf3;--muted:#7d8590;--green:#3fb950;--blue:#58a6ff;--purple:#a371f7;--yellow:#d29922;
  --disp:"Mona Sans","Segoe UI",system-ui,-apple-system,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--text);font:13px/1.5 var(--mono);overflow:hidden}
body{display:grid;grid-template-rows:auto 1fr auto}
#stage{position:relative;min-height:0}
#stage canvas{position:absolute;inset:0}
canvas{display:block;touch-action:none;cursor:grab}
canvas.hit{cursor:pointer}
.top{padding:20px 20px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.eyebrow{color:var(--muted);font-size:11px;letter-spacing:.2em}
h1{font:800 clamp(22px,4vw,32px)/1.15 var(--disp);margin-top:6px}
.top>div{min-width:0}
.facts{display:flex;gap:22px;margin-top:16px;flex-wrap:wrap}
.fact{border-left:3px solid;padding-left:10px}
.fact b{display:block;font:800 22px/1.2 var(--disp)}
.fact span{color:var(--muted);font-size:11px;white-space:nowrap}
a.back{flex-shrink:0;color:var(--muted);text-decoration:none;border:1px solid var(--border);background:var(--panel);padding:6px 12px;border-radius:6px;font-size:12px;white-space:nowrap}
a.back:hover{color:var(--text);border-color:var(--muted)}
.bottom{padding:0 20px 16px;display:flex;justify-content:space-between;gap:6px 12px;flex-wrap:wrap;color:var(--muted);font-size:11px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin:0 2px;vertical-align:-1px}
#tip{position:fixed;left:0;top:0;pointer-events:none;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 12px;
  white-space:nowrap;opacity:0;transition:opacity .12s;box-shadow:0 8px 24px rgba(1,4,9,.6)}
#tip b{display:block;font:800 15px/1.3 var(--disp)}
#tip span{color:var(--muted);font-size:11px}
#msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted)}
@media (max-width:600px){.top{padding:16px 16px 0}a.back{padding:5px 9px;font-size:11px}h1{font-size:22px}.bottom{padding:0 16px 12px}.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:12px}.fact{padding-left:7px}.fact b{font-size:15px}.fact span{font-size:10px}.eyebrow{font-size:10px}}
</style>
</head>
<body>
<div class="top">
  <div>
    <div class="eyebrow">CONTRIBUTION CITY · 3D</div>
    <h1>The skyline I built this year</h1>
    <div class="facts" id="facts"></div>
  </div>
  <a class="back" href="https://github.com/SaTyAbHr2005">← GitHub profile</a>
</div>

<div id="stage"><div id="msg">loading the city…</div></div>
<div class="bottom">
  <span class="legend">less <i style="background:#21262d"></i><i style="background:#0e4429"></i><i style="background:#006d32"></i><i style="background:#26a641"></i><i style="background:#39d353"></i> more</span>
  <span id="hint">hover a building · drag to rotate · scroll to zoom</span>
</div>
<div id="tip"></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const LEVELS = ["#21262d", "#0e4429", "#006d32", "#26a641", "#39d353"];
const msg = document.getElementById("msg"), tip = document.getElementById("tip");

let days;
try {
  days = (await (await fetch("contributions.json", { cache: "no-cache" })).json()).days;
} catch (e) {
  msg.textContent = "Couldn't load contribution data.";
  throw e;
}
msg.remove();
if (matchMedia("(pointer:coarse)").matches) document.getElementById("hint").textContent = "tap a building · drag to rotate · pinch to zoom";

// ---- data: weeks x weekdays, GitHub's quartile colour levels
const parse = s => new Date(s + "T00:00:00Z");
const first = parse(days[0].date);
first.setUTCDate(first.getUTCDate() - first.getUTCDay());  // back to Sunday
const top = Math.max(1, ...days.map(d => d.count));
const nz = days.map(d => d.count).filter(Boolean).sort((a, b) => a - b);
const cuts = nz.length ? [1, 2, 3].map(q => nz[Math.floor(nz.length * q / 4)]) : [1, 1, 1];
const level = n => n ? 1 + cuts.filter(k => n > k).length : 0;
const height = n => n ? 0.5 + 7 * Math.sqrt(n / top) : 0.12;
const cells = days.map(d => {
  const t = parse(d.date);
  return { ...d, t, w: Math.floor((t - first) / 6048e5), r: t.getUTCDay() };
});
const weeks = Math.max(...cells.map(c => c.w)) + 1;
const fmt = (t, o) => t.toLocaleDateString("en-US", { timeZone: "UTC", ...o });

// ---- facts (same ones as the README card)
const busiest = cells.reduce((a, b) => b.count > a.count ? b : a);
const byWd = Array.from({ length: 7 }, () => []), byM = {};
cells.forEach(c => { byWd[c.r].push(c.count); const k = c.date.slice(0, 7); byM[k] = (byM[k] || 0) + c.count; });
const avg = a => a.reduce((x, y) => x + y, 0) / Math.max(1, a.length);
const wd = [...byWd.keys()].reduce((a, b) => avg(byWd[b]) > avg(byWd[a]) ? b : a);
const bm = Object.keys(byM).reduce((a, b) => byM[b] > byM[a] ? b : a);
const total = cells.reduce((s, c) => s + c.count, 0);
document.getElementById("facts").innerHTML = [
  [total.toLocaleString(), "contributions", "var(--green)"],
  [busiest.count, "busiest · " + fmt(busiest.t, { month: "short", day: "numeric" }), "var(--yellow)"],
  [fmt(new Date(Date.UTC(2024, 8, 1 + wd)), { weekday: "short" }), "strongest weekday", "var(--blue)"],
  [fmt(parse(bm + "-01"), { month: "short" }), `best month · ${byM[bm]}`, "var(--purple)"],
].map(([v, l, c]) => `<div class="fact" style="border-color:${c}"><b>${v}</b><span>${l}</span></div>`).join("");

// ---- scene
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor("#0d1117");
const stage = document.getElementById("stage");
stage.append(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog("#0d1117", 70, 140);
const camera = new THREE.OrthographicCamera();
camera.position.set(-38, 34, 46);
scene.add(new THREE.HemisphereLight("#cfe8ff", "#0d1117", 1.6));
const sun = new THREE.DirectionalLight("#ffffff", 2.2);
sun.position.set(-20, 40, 30);
scene.add(sun);

const ground = new THREE.Mesh(new THREE.BoxGeometry(weeks + 1.2, 0.3, 8.2), new THREE.MeshStandardMaterial({ color: "#161b22", roughness: 1 }));
ground.position.y = -0.15;
scene.add(ground);

const geo = new THREE.BoxGeometry(0.8, 1, 0.8).translate(0, 0.5, 0);
const meshes = cells.map(c => {
  const mat = new THREE.MeshStandardMaterial({ color: LEVELS[level(c.count)], roughness: 0.55, metalness: 0.05, emissive: "#39d353", emissiveIntensity: 0 });
  const m = new THREE.Mesh(geo, mat);
  m.position.set(c.w - weeks / 2 + 0.5, 0, c.r - 3);
  m.scale.y = 0.001;
  m.userData = { c, h: height(c.count), lift: 1, glow: 0 };
  scene.add(m);
  return m;
});

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;
controls.minZoom = 0.7;
controls.maxZoom = 4;
controls.maxPolarAngle = Math.PI / 2.15;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;
controls.addEventListener("start", () => { controls.autoRotate = false; });

function resize() {
  const w = stage.clientWidth, h = Math.max(stage.clientHeight, 1), a = w / h;
  const half = Math.max(12, (weeks * 0.5) / a);  // fit the long side on any screen
  Object.assign(camera, { left: -half * a, right: half * a, top: half, bottom: -half, near: -200, far: 400 });
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}
new ResizeObserver(resize).observe(stage);
resize();

// ---- hover: the building under the pointer rises (neighbours ripple) and reports its count
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let hovered = null, px = 0, py = 0;
function pick(e) {
  px = e.clientX; py = e.clientY;
  const b = renderer.domElement.getBoundingClientRect();
  ptr.set((px - b.left) / b.width * 2 - 1, -((py - b.top) / b.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  hovered = ray.intersectObjects(meshes, false)[0]?.object ?? null;
  renderer.domElement.classList.toggle("hit", !!hovered);
  if (hovered) {
    const { c } = hovered.userData;
    tip.innerHTML = `<b>${c.count ? c.count + " contribution" + (c.count > 1 ? "s" : "") : "No contributions"}</b><span>${fmt(c.t, { weekday: "short", month: "short", day: "numeric", year: "numeric" })}</span>`;
  }
  tip.style.opacity = hovered ? 1 : 0;
}
renderer.domElement.addEventListener("pointermove", pick);
renderer.domElement.addEventListener("pointerdown", pick);
renderer.domElement.addEventListener("pointerleave", () => { hovered = null; tip.style.opacity = 0; });

// ---- loop
const clock = new THREE.Clock();
const ease = t => 1 - Math.pow(1 - Math.min(Math.max(t, 0), 1), 3);
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
const tmp = new THREE.Vector3();
function frame() {
  const t = still ? 99 : clock.getElapsedTime();
  const hc = hovered?.userData.c;
  for (const m of meshes) {
    const u = m.userData, c = u.c;
    const d2 = hc ? (c.w - hc.w) ** 2 + (c.r - hc.r) ** 2 : 99;
    const liftTo = 1 + (d2 === 0 ? 0.55 : 0.25 * Math.exp(-d2 / 2));
    u.lift += (liftTo - u.lift) * 0.18;
    u.glow += ((d2 === 0 ? 0.6 : 0) - u.glow) * 0.2;
    const rise = ease((t - 0.2 - c.w * 0.03) / 0.9);
    m.scale.y = Math.max(0.001, u.h * rise * u.lift + (d2 === 0 ? 0.6 : 0) * rise);
    m.material.emissiveIntensity = u.glow;
  }
  if (hovered) {  // keep the tooltip pinned above the building's roof
    tmp.copy(hovered.position).setY(hovered.scale.y + 0.4).project(camera);
    const b = renderer.domElement.getBoundingClientRect();
    const x = b.left + (tmp.x + 1) / 2 * b.width, y = b.top + (1 - tmp.y) / 2 * b.height;
    tip.style.transform = `translate(${Math.min(Math.max(x - tip.offsetWidth / 2, 8), innerWidth - tip.offsetWidth - 8)}px, ${Math.max(y - tip.offsetHeight - 10, 8)}px)`;
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
